<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Coding Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Minimal Coding Agent</h1>
      <button id="new-chat" type="button" class="new-chat">新对话</button>
    </header>
    <section id="chat" class="chat"></section>
    <form id="form" class="input-row">
      <input id="message" placeholder="输入需求，如：总结 docs/README.md 的内容" autocomplete="off" />
      <button type="submit">发送</button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
